add_newline = true
palette = "catppuccin_mocha"

format = """
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$line_break\
$character
"""

right_format = """
$status\
$jobs\
$nodejs\
$dotnet\
$java\
$golang\
$python
"""

[directory]
style = "bold lavender"
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style)) "

[cmd_duration]
min_time = 1000
format = "[󱦟 $duration](overlay1)"

[status]
disabled = false
symbol = "✘ "
success_symbol = ""
format = "[$symbol$status]($style) "
style = "bold red"

[jobs]
symbol = "󰒋 "
style = "bold teal"

[nodejs]
symbol = " "
format = "[$symbol$version]($style) "
style = "green"

[dotnet]
symbol = " "
format = "[$symbol$version]($style) "
style = "mauve"

[java]
symbol = " "
format = "[$symbol$version]($style) "
style = "peach"

[golang]
symbol = " "
format = "[$symbol$version]($style) "
style = "blue"

[python]
symbol = " "
format = "[$symbol$version]($style) "
style = "yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
