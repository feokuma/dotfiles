# hypridle — idle management daemon (hyprlang syntax, not Lua like Hyprland).
# Started from Hyprland autostart (autostart.lua).
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# NOTE: idle listeners (auto-lock/suspend) are disabled while hyprlock
# is being brought up. Uncomment once screen lock is validated.

general {
    # Guard against duplicate lock instances (dbus lock events, manual lock).
    lock_cmd = pidof hyprlock || hyprlock
    # Lock right before any suspend happens.
    before_sleep_cmd = pidof hyprlock || hyprlock
    # auto: pauses idle counting while a lock screen is active.
    inhibit_sleep = 2
}

