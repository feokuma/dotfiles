general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = hyprctl dispatch dpms on
    inhibit_sleep = 3
}

# Lock screen after 10 minutes
listener {
    timeout = 600
    on-timeout = pidof hyprlock || hyprlock
}

# Turn the monitor off after 15 minutes (DPMS off)
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Warn 1 minute before suspend
listener {
    timeout = 1140
    on-timeout = notify-send "Hyprland" "⚠️ The system will be suspended in 1 minute.." --urgency=critical
}

# Suspend after 20 minutes
# Plain suspend: hibernate is not available (no swap), and systemd rejects
# suspend-then-hibernate entirely when hibernation is impossible.
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
