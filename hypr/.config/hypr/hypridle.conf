general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = hyprctl dispatch dpms on
    inhibit_sleep = 3
}

# Lock screen after 10 minutes
# ignore_inhibit keeps the lock running even while a logind/DBus idle
# inhibitor (e.g. a video player) is held.
listener {
    timeout = 600
    on-timeout = pidof hyprlock || hyprlock
    ignore_inhibit = 1
}

# Turn the monitor off after 15 minutes (DPMS off)
# Also ignores inhibitors: the screen still blanks while media is playing.
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
    ignore_inhibit = 1
}

# Suspend after 20 minutes
# Plain suspend: hibernate is not available (no swap), and systemd rejects
# suspend-then-hibernate entirely when hibernation is impossible.
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
