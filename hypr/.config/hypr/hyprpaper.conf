# hyprpaper wallpaper sources (hyprpaper 0.8 syntax).
# The per-machine wallpaper lives in hyprpaper-local.conf (not versioned;
# rewritten by the Quickshell wallpaper picker via sed). This file stays
# stable so wallpaper changes never dirty the dotfiles repo.
# IPC: hyprctl hyprpaper wallpaper '[mon], [path], [fit_mode]'
#      hyprctl hyprpaper listactive

source = ~/.config/hypr/hyprpaper-local.conf
