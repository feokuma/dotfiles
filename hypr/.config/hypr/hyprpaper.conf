# hyprpaper wallpaper sources (hyprpaper 0.8 syntax).
# Swapping images means editing the path here.
# IPC: hyprctl hyprpaper wallpaper '[mon], [path], [fit_mode]'
#      hyprctl hyprpaper listactive

# Hide the random quote text hyprpaper draws at the bottom of the desktop.
splash = false

wallpaper {
    monitor =
    path = /home/feokuma/Pictures/Wallpapers/Calm Office.png
    fit_mode = cover
}
